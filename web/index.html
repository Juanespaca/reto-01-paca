<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agente Registro como Proveedor — Periferia IT Group</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    background: #111827;
    color: white;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; margin: 2px 0 0; color: #9ca3af; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 720px; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 14px;
  }
  .msg.user .bubble { background: #2563eb; color: white; }
  .msg.assistant .bubble { background: white; border: 1px solid #e5e7eb; }
  .tool-call {
    margin-top: 8px;
    font-size: 12px;
    background: #0f172a;
    color: #d1fae5;
    border-radius: 8px;
    padding: 8px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-x: auto;
  }
  .tool-call .nombre { color: #93c5fd; font-weight: 600; }
  .tool-call .ok { color: #34d399; }
  .tool-call .fail { color: #f87171; }
  .confirm-banner {
    margin-top: 8px;
    background: #fef3c7;
    border: 1px solid #f59e0b;
    color: #78350f;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  #thinking { font-size: 13px; color: #6b7280; padding: 0 20px 10px; }
  footer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    background: white;
    border-top: 1px solid #e5e7eb;
  }
  #input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #93c5fd; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>Agente "Registro como Proveedor" · Periferia IT Group</h1>
    <p id="status">conectando…</p>
  </header>
  <div id="chat"></div>
  <div id="thinking" style="display:none;">El agente está pensando…</div>
  <footer>
    <input id="input" type="text" placeholder='Ej: Procesa el caso "ec-corp-andina"' />
    <button id="send">Enviar</button>
  </footer>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const thinkingEl = document.getElementById('thinking');
  const statusEl = document.getElementById('status');

  let sessionId = localStorage.getItem('sessionId') || null;

  fetch('/api/health').then(r => r.json()).then(d => {
    statusEl.textContent = d.ok ? `listo · ${d.provider} / ${d.model}` : 'el backend respondió con error';
  }).catch(() => { statusEl.textContent = 'no se pudo conectar al backend'; });

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    return wrap;
  }

  function addToolCalls(wrap, toolCalls) {
    for (const tc of toolCalls) {
      const div = document.createElement('div');
      div.className = 'tool-call';
      const statusClass = tc.ok ? 'ok' : 'fail';
      const statusText = tc.ok ? 'ok' : 'error';
      div.innerHTML = `<span class="nombre">${tc.nombre}</span>(${JSON.stringify(tc.args)}) → <span class="${statusClass}">${statusText}</span>\n${JSON.stringify(tc.resultado, null, 2)}`;
      wrap.appendChild(div);
    }
  }

  function addConfirmBanner(wrap) {
    const div = document.createElement('div');
    div.className = 'confirm-banner';
    div.textContent = '⚠️ El agente está esperando tu confirmación explícita antes de continuar.';
    wrap.appendChild(div);
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    addMessage('user', text);
    thinkingEl.style.display = 'block';
    sendBtn.disabled = true;

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await resp.json();
      if (data.sessionId) {
        sessionId = data.sessionId;
        localStorage.setItem('sessionId', sessionId);
      }
      if (!resp.ok) {
        addMessage('assistant', `Error: ${data.error || 'desconocido'}`);
      } else {
        const wrap = addMessage('assistant', data.reply || '(sin respuesta de texto)');
        if (data.toolCalls && data.toolCalls.length) addToolCalls(wrap, data.toolCalls);
        if (data.needsConfirmation) addConfirmBanner(wrap);
      }
    } catch (e) {
      addMessage('assistant', `Error de red: ${e}`);
    } finally {
      thinkingEl.style.display = 'none';
      sendBtn.disabled = false;
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
